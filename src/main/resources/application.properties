spring.application.name=filesMicroService

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/FilesMicroService_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Muestra las sentencias SQL generadas por Hibernate en la consola. (LOCAL ONLY)
#spring.jpa.show-sql=true
# Formatea las sentencias SQL mostradas para una mejor legibilidad.
spring.jpa.properties.hibernate.format_sql=true
# Define el dialecto de Hibernate espec√≠fico para PostgreSQL, optimizando las sentencias SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#route for uploads
file.upload-dir=./uploads

# LÌmite para un solo archivo
spring.servlet.multipart.max-file-size=10MB