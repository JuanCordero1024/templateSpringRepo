spring.application.name=userMicroService

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/userMicroService_db
spring.datasource.username=myuser
spring.datasource.password=password123

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Muestra las sentencias SQL generadas por Hibernate en la consola.
spring.jpa.show-sql=true
# Formatea las sentencias SQL mostradas para una mejor legibilidad.
spring.jpa.properties.hibernate.format_sql=true
# Define el dialecto de Hibernate específico para PostgreSQL, optimizando las sentencias SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs