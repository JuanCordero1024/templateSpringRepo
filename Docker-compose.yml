version: '3.8'

services:
  # ------------------------------------------------
  # SERVICIO DE BASE DE DATOS (PostgreSQL 15)
  # ------------------------------------------------
  FilesMicroServiceDB:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: FilesMicroService_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ------------------------------------------------
  # SERVICIO DE APLICACIÓN (Spring Boot)
  # ------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AppMicroService
    restart: on-failure
    ports:
      - "8084:8080"
    depends_on:
      - FilesMicroServiceDB

    volumes:
      - ./uploads:/app/uploads

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://FilesMicroServiceDB:5432/FilesMicroService_db
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: password123
      FILE_UPLOAD_DIR: /app/uploads

# Volumen para persistir los datos de PostgreSQL (interno de Docker)
volumes:
  postgres_data: