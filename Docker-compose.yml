version: '3.8'

services:
  # ------------------------------------------------
  # SERVICIO DE BASE DE DATOS (PostgreSQL 15)
  # ------------------------------------------------
  MicroServiceDB: # <-- 1. NOMBRE DEL SERVICIO (HOST)
    image: postgres:15-alpine
    restart: always
    environment:
      # 2. NOMBRE DE LA BASE DE DATOS
      POSTGRES_DB: filesmicroService_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ------------------------------------------------
  # SERVICIO DE APLICACIÓN (Spring Boot)
  # ------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: FilesMicroService
    restart: on-failure
    ports:
      - "8090:8080"
    depends_on:
      # 3. La aplicación depende de este nombre de servicio
      - MicroServiceDB
    environment:
      # ¡CORRECCIÓN CRÍTICA!
      # El host (MicroServiceDB) debe coincidir con el nombre del servicio DB (Línea 7).
      # El nombre de la DB (filesmicroService_db) debe coincidir con POSTGRES_DB (Línea 14).
      SPRING_DATASOURCE_URL: jdbc:postgresql://MicroServiceDB:5432/filesmicroService_db
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: password123

# Volumen para persistir los datos de PostgreSQL
volumes:
  postgres_data: