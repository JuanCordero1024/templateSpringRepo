version: '3.8'

services:
  # ------------------------------------------------
  # SERVICIO DE BASE DE DATOS (PostgreSQL 15)
  # ------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      # Las variables de entorno coinciden con la configuración en application.properties
      POSTGRES_DB: microservice_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      # Persistencia de datos: almacena los datos de la DB fuera del contenedor para que no se pierdan
      - postgres_data:/var/lib/postgresql/data

  # ------------------------------------------------
  # SERVICIO DE APLICACIÓN (Spring Boot)
  # ------------------------------------------------
  app:
    build:
      context: .  # Busca el Dockerfile en el directorio actual
      dockerfile: Dockerfile
    container_name: spring_microservice
    restart: on-failure
    ports:
      # Mapea el puerto 8080 del contenedor al puerto 8080 de tu máquina local
      - "8080:8080"
    depends_on:
      # Asegura que la base de datos se inicie antes que la aplicación
      - db
    environment:
      # También puedes pasar las variables de conexión aquí, aunque ya están en application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/microservice_db
      SPRING_DATASOURCE_USERNAME: dockeruser
      SPRING_DATASOURCE_PASSWORD: password123

# Volumen para persistir los datos de PostgreSQL
volumes:
  postgres_data:
